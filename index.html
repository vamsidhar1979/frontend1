<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Student Management System</h1>

        <div class="card">
            <h2>Add Student</h2>

            <form id="studentForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Student Name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="text"
                    id="course"
                    placeholder="Course"
                    required
                >

                <button type="submit">Add Student</button>

            </form>

            <p id="message"></p>
        </div>

        <div class="card">
            <h2>Students</h2>

            <button onclick="loadStudents()">Refresh Students</button>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                    </tr>
                </thead>

                <tbody id="studentTableBody">
                </tbody>
            </table>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
